name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f naqaa.zip ]; then unzip -o naqaa.zip; fi
          if [ -f nsfw.tflite ]; then mkdir -p app/src/main/assets && cp nsfw.tflite app/src/main/assets/; fi
          ls -R app/src/main | head -50

      - name: Check model
        run: test -f app/src/main/assets/nsfw.tflite

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: naqaa-apk
          path: app/build/outputs/apk/debug/*.apk
